<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Service & Supplier Finder - Rwanda AI Platform</title><link rel="stylesheet"
href="style.css"><style>

.finder-container {
  width: 92%;
  max-width: 1000px;
  margin: 30px auto;
}

.finder-search {
  background: #f5f5f5;
  padding: 20px;
  border-radius: 12px;
}

.finder-search h2 {
  color: #00A1DE;
}

.filter-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.finder-results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  margin-top: 25px;
}

.provider-card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  text-align: left;
}

.provider-card h3 {
  color: #00A1DE;
  margin-top: 0;
}

.provider-card button {
  margin-top: 10px;
}

#finderStatus {
  margin-top: 15px;
  font-weight: bold;
}

</style></head><body><header><h1>🔎 Service & Supplier Finder</h1><p>
Find services, suppliers and businesses in Rwanda
</p></header><nav><a href="index.html">Home</a>

<a href="finder.html">Finder</a>

<a href="ai.html">AI Assistant</a>

<a href="register.html">Register Service</a>

<a href="categories.html">Categories</a>

</nav><section class="hero"><h2>Find a Service or Supplier</h2><p>
Search by service, supplier, category or location.
</p></section><main class="finder-container"><section class="finder-search"><h2>🔍 Search</h2><input
id="finderSearch"
type="text"
placeholder="e.g. electrician, supplier, barber...">

<div class="filter-row"><select id="categoryFilter"><option value="">
All Categories
</option></select><input
id="locationFilter"
type="text"
placeholder="District or Location">

<input
id="priceFilter"
type="text"
placeholder="Price">

</div><br><button id="finderSearchBtn">Search

</button><button id="clearFinderBtn"
type="button">

Clear

</button><p id="finderStatus">Loading providers...

</p></section><section
id="finderResults"
class="finder-results"></section></main><footer><p>
© 2026 Rwanda AI Platform
</p></footer><script
type="module"
src="finder.js">
</script></body></html>
